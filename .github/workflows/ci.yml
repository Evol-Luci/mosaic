name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  #
  # Added 2026-10-18 after an outage in which every run failed in ~2 seconds having
  # executed ZERO steps, with no runner ever assigned -- and there was no way to retry on
  # demand. `gh run rerun` only re-runs an EXISTING run, which is not the same thing when
  # you are trying to establish whether the platform has recovered, and it cannot be
  # pointed at a branch that has no run yet.
  workflow_dispatch:

jobs:
  build-and-test:
    # NOTE: ubuntu-latest is 24.04 (noble) as of this writing and is scheduled to
    # move to Ubuntu 26 starting 2026-10-19 (github.com/actions/runner-images#14748).
    # The LunarG apt list URL below is pinned to the "noble" codename explicitly, not
    # derived from ubuntu-latest -- when that migration lands, this list (and possibly
    # the GLFW/X11 dev package names) will need updating in lockstep, or this workflow
    # will start failing at the "Install Vulkan SDK components" step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runner environment (recorded beside every timing)
        # Standing diagnostic. Image, compiler and core count all move build timings, and the
        # ubuntu-latest -> Ubuntu 26 migration can flip them between two runs. Anything that
        # compares timings across runs must first check these lines match.
        run: |
          echo "ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset} nproc=$(nproc)"
          gcc --version | head -1
          cmake --version | head -1
          # Self-documenting only; nothing gates on it (4 concurrent test processes peak ~340 MB).
          free -m | sed -n '1,2p'

      - name: Dependency-rule lint's own unit tests
        run: python3 -m unittest tools/ci/test_check_dependency_rules.py

      - name: Dependency-rule check
        run: python3 tools/ci/check_dependency_rules.py

      - name: Dependency-pin lint's own unit tests
        run: python3 -m unittest tools/ci/test_check_dependency_pins.py

      - name: Dependency-pin check (FetchContent SHAs)
        run: python3 tools/ci/check_dependency_pins.py

      - name: Test-name lint's own unit tests
        run: python3 -m unittest tools/ci/test_check_test_case_names.py

      - name: Test-name check (ctest discovery)
        run: python3 tools/ci/check_test_case_names.py

      - name: CI ctest-run guard's own unit tests
        run: python3 -m unittest tools/ci/test_check_ctest_run.py

      - name: next-steps claims checker's own unit tests
        run: python3 -m unittest tools/docs/test_check_next_steps_claims.py

      - name: Install Vulkan SDK components (loader + headers + glslc)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          # Named components only, not the `vulkan-sdk` meta-package: that package
          # also pulls in crashdiagnosticlayer, whose libyaml-cpp0.7 dependency isn't
          # installable on ubuntu-latest (24.04/noble) as of this writing -- we only
          # need the loader + headers (to satisfy CMake's find_package(Vulkan)) and
          # shaderc (which provides the glslc binary CMake shells out to at build time).
          sudo apt-get install -y vulkan-headers libvulkan-dev shaderc

      - name: Install build + GLFW (X11/Wayland) dependencies
        run: |
          sudo apt-get install -y \
            ninja-build \
            ccache \
            python3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libgl-dev \
            pkg-config

      # --- TRIAL (2026-10-24): software Vulkan, so the opt-in GPU tests can run here ------
      # Deliberately its OWN step, so the GitHub step timer reports the apt cost on its own.
      # That number is the one thing the lavapipe probe could not measure locally
      # (docs/project/lavapipe-probe-findings.md, "What Could Not Be Determined Locally"),
      # and it is the figure that decides whether this trial stays. If it is large, delete
      # this step and the two below; nothing else depends on them.
      #
      # vulkan-validationlayers is NOT optional: the GPU tests hard-assert
      # `validation_enabled()`, so without it they fail rather than silently run unvalidated.
      - name: Install Mesa lavapipe (software Vulkan ICD) + validation layers
        run: |
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers
          dpkg-query -W -f='mesa-vulkan-drivers ${Version}\n' mesa-vulkan-drivers
          dpkg-query -W -f='vulkan-validationlayers ${Version}\n' vulkan-validationlayers
          ls -1 /usr/share/vulkan/icd.d/ /usr/share/vulkan/explicit_layer.d/

      # --- ccache (design: docs/superpowers/specs/2026-10-20-ci-build-caching-design.md) -------
      # ccache's own content hash is what makes a hit valid (preprocessed source + compiler +
      # flags). The actions/cache key below only chooses WHICH bucket of that store to restore,
      # so a key that is too loose wastes quota or misses; it cannot put a wrong object in a build.
      # Policy: first-party actions only; only a green push to main SAVES (see the save step).
      - name: ccache settings and cache key
        id: cc
        run: |
          # Fail LOUDLY if the runner stops providing this: a silent fallback would put every OS
          # in one bucket and defeat the Ubuntu-26-migration protection. ImageVersion is
          # deliberately NOT in the key: it changes with every runner-image release, which would
          # reset the bucket weekly (measured: a rollout mid-campaign made every run cold). It is
          # not needed for correctness: ccache hashes the compiler binary and the preprocessed
          # source, including system headers.
          : "${ImageOS:?ImageOS not set}"
          {
            echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
            echo "CCACHE_COMPILERCHECK=content"
            # 1G, not 500M: measured on CI, one 171-TU header change took a 500M store to 98.6%
            # of the cap (106% after a flags change), at which point ccache evicts
            # least-recently-used entries during ordinary work, and the eviction lands on the
            # entries the NEXT build wants. A full tree is ~266 MB; restore costs 2-5 s at that
            # size, so more headroom costs seconds against a multi-minute rebuild.
            echo "CCACHE_MAXSIZE=1G"
          } >> "$GITHUB_ENV"
          echo "prefix=ccache-v1-${ImageOS}-gcc$(gcc -dumpfullversion)-" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cc.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cc.outputs.prefix }}

      - name: ccache sanity (cache dir is the cached dir)
        run: |
          ccache --version | head -1
          cfg="$(ccache --show-config | sed -n 's/^.*cache_dir = //p' | head -1)"
          echo "ccache cache_dir=${cfg} cached path=${RUNNER_TEMP}/ccache"
          test "${cfg}" = "${RUNNER_TEMP}/ccache" || { echo "::error::ccache would write somewhere other than the directory actions/cache saves"; exit 1; }
          du -sh "${RUNNER_TEMP}/ccache" 2>/dev/null || echo "cache dir empty (cold)"
          ccache --zero-stats

      # PCH is DISABLED here on purpose, and it is not a hedge -- it is measured.
      # The stdlib PCH (MOSAIC_PCH_HEADERS) exists for the LOCAL developer loop; its own
      # backlog row says "impact is on the developer loop, not CI". ccache cannot cache a
      # compilation that consumes a PCH without sloppiness settings, so leaving it on made
      # 243 of 456 calls UNCACHEABLE (53%) and took this job from 1m38s to 6m49s -- every
      # PR, permanently, since the cache restored fine and the 213 cacheable calls still hit
      # 100%. Turning it off here restores 452/452 cacheable and costs nothing we wanted,
      # because CI does no incremental header-edit rebuilds.
      # It also makes the include-hygiene guard FREE: a PCH can hide a missing #include, and
      # this job is now exactly the no-PCH build that catches one, on every PR.
      - name: Configure (debug)
        run: >
          cmake --preset debug -G Ninja
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          -DMOSAIC_ENABLE_GPU_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (debug)
        run: cmake --build --preset debug -j"$(nproc)"

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats
          du -sh "${RUNNER_TEMP}/ccache" 2>/dev/null || true

      - name: Unit tests
        # Parallel (design: docs/superpowers/specs/2026-10-21-ci-parallel-ctest-design.md).
        # catch_discover_tests registers one process per TEST_CASE, so ctest never runs the
        # suite in one process at any -j; the full-suite-ordering SIGSEGV recorded for the
        # threaded ScriptSystem case is therefore unreachable here (it is a hazard of running
        # the binary directly). The two cases once excluded with -E were not flaky either: see
        # ScriptWorker::collect() in #208. -j"$(nproc)" matches the build step.
        #
        # The standing guard: a green exit code does not say how many tests ran, and a parallel
        # or filtered run that silently ran fewer would be green and protect nothing. So N is
        # taken from `ctest -N` IN THIS JOB (never a literal), and the JUnit file must contain
        # exactly N testcases, all passed. There is deliberately no fallback for an empty or zero
        # N and no `|| true`: the check script fails hard on both. ctest's own failure and the
        # check's failure are both reported before the step exits.
        #
        # `-LE gpu` EXCLUDES the opt-in GPU tests, which this job also builds since the
        # lavapipe trial. It is a label, not a name match: tests/CMakeLists.txt tags them
        # via catch_discover_tests(... LABELS gpu). Both the `ctest -N` denominator and the
        # run carry the same filter, so N stays 1462 against the 1462 `add_test` lines in
        # mosaic_unit_tests-*_tests.cmake and O1 still means what it meant. The GPU tests
        # get their own step, with their own N and their own generated file.
        run: |
          N="$(ctest --preset debug -N -LE gpu | sed -n 's/^Total Tests: *//p')"
          echo "discovered N=${N}"
          JUNIT="${RUNNER_TEMP}/ctest-junit.xml"
          set +e
          ctest --preset debug -LE gpu --output-on-failure --no-tests=error -j"$(nproc)" --output-junit "${JUNIT}"
          ctest_rc=$?
          python3 tools/ci/check_ctest_run.py "${JUNIT}" "${N}" build/debug/tests/mosaic_unit_tests-*_tests.cmake
          check_rc=$?
          # Informational per-case summary (longest case + sum of durations) so the number is
          # observable in every run; the enforcing 10.0s per-case budget is O3 in the check above.
          python3 tools/ci/check_ctest_run.py --report "${JUNIT}"
          echo "ctest_rc=${ctest_rc} check_rc=${check_rc}"
          exit $(( ctest_rc != 0 || check_rc != 0 ))

      - name: next-steps claims check
        # Must run AFTER "Unit tests", not with the early lints: verifying Suite size and
        # Suite status needs the built tree and the JUnit file produced above. `JUNIT` is a
        # shell variable local to the "Unit tests" step, so its path is spelled out again here.
        run: python3 tools/docs/check_next_steps_claims.py --junit "${RUNNER_TEMP}/ctest-junit.xml"

      # --- TRIAL (2026-10-24) ------------------------------------------------------------
      # The GPU tests run SEPARATELY from the suite above, and that is the whole design.
      # Folding them into the main ctest invocation would have broken two standing guards at
      # once: check_ctest_run.py's O1 (one glob, 1462 add_test lines, vs. a discovered 1468)
      # and check_next_steps_claims.py's Suite size / Suite status rows, which would then
      # have to track a number no local default build produces. Split, each suite keeps an
      # exact denominator and the handoff keeps saying 1462, which is what `ctest --preset
      # debug -N` still prints without -DMOSAIC_ENABLE_GPU_TESTS=ON.
      - name: Lavapipe device identity (the measurement this trial exists for)
        # Prove WHICH device the tests will use before trusting anything they report. The
        # local probe's scratch ICD was Mesa 26.2.2 from Arch; the runner's is older and was
        # never measured, so the version printed here is a finding, not boilerplate. Note
        # Ubuntu names the manifest lvp_icd.x86_64.json where Arch names it lvp_icd.json.
        run: |
          ICD=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          test -f "$ICD" || { echo "::error::lavapipe ICD manifest not found at $ICD"; ls -1 /usr/share/vulkan/icd.d/; exit 1; }
          echo "VK_ICD_FILENAMES=${ICD}" >> "$GITHUB_ENV"
          # Every selected device must be llvmpipe. A hardware or unexpected ICD here would
          # still go green in the step below while measuring something else entirely.
          VK_ICD_FILENAMES="$ICD" VK_LOADER_DEBUG=driver \
            ./build/debug/tests/mosaic_gpu_tests "gpu headless Vulkan device creates and destroys cleanly twice in one process" \
            > /tmp/lvp-trace.txt 2>&1 || { echo "::error::the lavapipe identity probe could not run the headless device test"; tail -40 /tmp/lvp-trace.txt; exit 1; }
          grep -o 'Using "[^"]*"' /tmp/lvp-trace.txt | sort | uniq -c
          if grep -o 'Using "[^"]*"' /tmp/lvp-trace.txt | grep -qv llvmpipe; then
            echo "::error::a non-llvmpipe device was selected; the timings below would not be a lavapipe measurement"
            exit 1
          fi

      - name: GPU tests under lavapipe
        # Same standing guard as the suite above, with its own denominator: N from `ctest -N
        # -L gpu` in THIS job, matched against the add_test lines in the GPU target's own
        # generated file. No `|| true`, and O2's skip guard is NOT relaxed -- a GPU test that
        # cannot reach a device fails (measured locally: a missing ICD fails 6 of 6 on
        # vkCreateInstance), it does not skip, and that is what keeps this step honest.
        run: |
          N="$(ctest --preset debug -N -L gpu | sed -n 's/^Total Tests: *//p')"
          echo "discovered gpu N=${N}"
          JUNIT="${RUNNER_TEMP}/ctest-gpu-junit.xml"
          set +e
          ctest --preset debug -L gpu --output-on-failure --no-tests=error -j"$(nproc)" --output-junit "${JUNIT}"
          ctest_rc=$?
          python3 tools/ci/check_ctest_run.py "${JUNIT}" "${N}" build/debug/tests/mosaic_gpu_tests-*_tests.cmake
          check_rc=$?
          python3 tools/ci/check_ctest_run.py --report "${JUNIT}"
          echo "ctest_rc=${ctest_rc} check_rc=${check_rc}"
          exit $(( ctest_rc != 0 || check_rc != 0 ))

      - name: Headless smoke test (mosaic run --ticks, no window/GPU)
        run: |
          PROJ="$(mktemp -d)/smoke_project"
          ./build/debug/app/mosaic create "$PROJ"
          ./build/debug/app/mosaic run "$PROJ" --ticks 120 --json

      # The split cache actions have NO post-step success guard, so this condition is ours to
      # write. Only a green push to main saves: a PR restores only (no PR write, including from
      # forks), purely so PR pushes cannot churn the ~10 GB pool and evict main's entry. (It is not
      # a poisoning defence: GitHub already scopes a PR's cache writes to that PR's ref.)
      # Re-running a main commit whose cache already exists does NOT fail this step, but it DOES
      # leave a yellow warning annotation on an otherwise green run. The key is <prefix><sha>, so
      # the save hits a duplicate key; actions/cache v4 catches it and reports it through
      # utils.logWarning plus core.warning("Cache save failed."), and the job stays green.
      # Observed 2026-10-21 on a re-run of the seeding push (attempt 2, conclusion success): the
      # log reads "Failed to save: Unable to reserve cache with key ..., another job may be
      # creating this cache." followed by "##[warning]Cache save failed.", shown as a yellow
      # annotation on the run summary.
      # Expected on a re-run of an already-cached main commit; nothing is wrong. Do not "fix" it,
      # and do not add continue-on-error, which would also hide a genuine save failure.
      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cc.outputs.prefix }}${{ github.sha }}
