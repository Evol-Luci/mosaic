name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # NOTE: ubuntu-latest is 24.04 (noble) as of this writing and is scheduled to
    # move to Ubuntu 26 starting 2026-10-19 (github.com/actions/runner-images#14748).
    # The LunarG apt list URL below is pinned to the "noble" codename explicitly, not
    # derived from ubuntu-latest -- when that migration lands, this list (and possibly
    # the GLFW/X11 dev package names) will need updating in lockstep, or this workflow
    # will start failing at the "Install Vulkan SDK components" step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK components (loader + headers + glslc)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          # Named components only, not the `vulkan-sdk` meta-package: that package
          # also pulls in crashdiagnosticlayer, whose libyaml-cpp0.7 dependency isn't
          # installable on ubuntu-latest (24.04/noble) as of this writing -- we only
          # need the loader + headers (to satisfy CMake's find_package(Vulkan)) and
          # shaderc (which provides the glslc binary CMake shells out to at build time).
          sudo apt-get install -y vulkan-headers libvulkan-dev shaderc

      - name: Install build + GLFW (X11/Wayland) dependencies
        run: |
          sudo apt-get install -y \
            ninja-build \
            python3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libgl-dev \
            pkg-config

      - name: Configure (debug)
        run: cmake --preset debug -G Ninja

      - name: Build (debug)
        run: cmake --build --preset debug -j"$(nproc)"

      - name: Unit tests
        run: ctest --preset debug --output-on-failure

      - name: Headless smoke test (mosaic run --ticks, no window/GPU)
        run: |
          PROJ="$(mktemp -d)/smoke_project"
          ./build/debug/app/mosaic create "$PROJ"
          ./build/debug/app/mosaic run "$PROJ" --ticks 120 --json
